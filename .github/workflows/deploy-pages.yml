name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore assets
        run: |
          set -euo pipefail
          mkdir -p assets/data
          restore_gz() {
            local prefix="$1" out="$2"
            local single="assets/data/${prefix}"
            local man="assets/data/${prefix}.manifest"
            if [ -f "$single" ]; then
              base64 -d "$single" | gzip -d > "$out"
            else
              # Assemble from .s0/.s1 full shards and/or zero-padded offset pieces
              local parts=()
              [ -f "assets/data/${prefix}.s0" ] && parts+=("assets/data/${prefix}.s0")
              [ -f "assets/data/${prefix}.s1" ] && parts+=("assets/data/${prefix}.s1")
              # Numeric offset pieces e.g. prefix.004000 (sorted)
              while IFS= read -r f; do parts+=("$f"); done < <(ls assets/data/${prefix}.[0-9]* 2>/dev/null | sort || true)
              if [ ${#parts[@]} -gt 0 ]; then
                cat "${parts[@]}" | base64 -d | gzip -d > "$out"
              elif [ -f "$man" ]; then
                local mp
                mp=$(tr '\n' ' ' < "$man")
                (cd assets/data && cat $mp) | base64 -d | gzip -d > "$out"
              else
                echo "Missing asset data for $prefix" >&2
                exit 1
              fi
            fi
            echo "Restored $out ($(wc -c < "$out") bytes)"
          }
          restore_gz world_geo_game.json.gz.b64 assets/data/world_geo_game.json
          restore_gz horse_quiz.json.gz.b64 assets/data/horse_quiz.json
          if [ -f assets/favicon.png.b64 ]; then base64 -d assets/favicon.png.b64 > assets/favicon.png; fi
          python3 << 'PY2'
          import struct, zlib, pathlib
          def write_png(path, rgba=(11,18,32,255), size=48):
              path = pathlib.Path(path)
              if path.exists():
                  return
              w = h = size
              r,g,b,a = rgba
              raw = b"".join(b"\x00" + bytes([r,g,b,a]) * w for _ in range(h))
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
              path.write_bytes(png)
              print("Generated", path)
          for name in ["icon.png", "splash-icon.png", "favicon.png",
                       "android-icon-foreground.png", "android-icon-background.png",
                       "android-icon-monochrome.png"]:
              write_png(f"assets/{name}")
          PY2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --no-fund --no-audit

      - run: npx expo export -p web --output-dir dist

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish dist to gh-pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORK=$(mktemp -d)
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          find "$WORK" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a dist/. "$WORK"/
          touch "$WORK/.nojekyll"
          cd "$WORK"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish to gh-pages"
          else
            git commit -m "Deploy expo web export from main ${GITHUB_SHA}"
            git push origin gh-pages
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
