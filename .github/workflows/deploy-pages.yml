name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Decode or generate binary assets
        run: |
          set -euo pipefail
          mkdir -p assets
          shopt -s nullglob
          for b64 in assets/*.png.b64; do
            out="${b64%.b64}"
            base64 -d "$b64" > "$out"
            echo "Decoded $b64 -> $out"
          done
          python3 << 'PY'
          import struct, zlib, pathlib
          def write_png(path, rgba=(11,18,32,255), size=48):
              path = pathlib.Path(path)
              if path.exists():
                  return
              w = h = size
              r,g,b,a = rgba
              raw = b"".join(b"\x00" + bytes([r,g,b,a]) * w for _ in range(h))
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
              path.write_bytes(png)
              print(f"Generated placeholder {path} ({len(png)} bytes)")
          for name in ["icon.png", "splash-icon.png", "favicon.png",
                       "android-icon-foreground.png", "android-icon-background.png",
                       "android-icon-monochrome.png"]:
              write_png(f"assets/{name}")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Export web build
        run: npx expo export -p web --output-dir dist

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
