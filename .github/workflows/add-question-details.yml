name: Add question details to Pages app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch patch script from main
        run: |
          curl -fsSL -o /tmp/p1.py https://raw.githubusercontent.com/CrypThias6/learning-hub/main/scripts/patch-question-details.py
          curl -fsSL -o /tmp/p2.py https://raw.githubusercontent.com/CrypThias6/learning-hub/main/scripts/patch_ui.py
          cat /tmp/p1.py /tmp/p2.py > /tmp/patch-question-details.py
          python3 -m py_compile /tmp/patch-question-details.py

      - name: Patch the live JS bundle
        run: |
          python3 /tmp/patch-question-details.py \
            _expo/static/js/web/index-e692932e42ea2ff98944c1bb62b893a7.js \
            _expo/static/js/web/index-e692932e42ea2ff98944c1bb62b893a7.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _expo/static/js/web/index-e692932e42ea2ff98944c1bb62b893a7.js
          git commit -m "Add grey detail text under every quiz question" || echo no change
          git push origin gh-pages
