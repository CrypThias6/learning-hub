name: Add Custom country filters on Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch patch script
        run: |
          curl -fsSL -o /tmp/add-custom-filters.py \
            https://raw.githubusercontent.com/CrypThias6/learning-hub/main/scripts/add-custom-filters.py
          python3 -m py_compile /tmp/add-custom-filters.py

      - name: Patch live bundle
        run: |
          python3 /tmp/add-custom-filters.py \
            _expo/static/js/web/index-e692932e42ea2ff98944c1bb62b893a7.js
          sed -i 's|index-e692932e42ea2ff98944c1bb62b893a7.js[^"]*|index-e692932e42ea2ff98944c1bb62b893a7.js?v=custom1|' index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _expo/static/js/web/index-e692932e42ea2ff98944c1bb62b893a7.js index.html
          git commit -m "Add Custom continent filters for targeted country practice" || echo no change
          git push origin gh-pages
