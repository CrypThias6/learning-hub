<!DOCTYPE html>

  <head>

      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0B1220" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1220" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0B1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="World Geo" />
    <meta name="format-detection" content="telephone=no" />
    <title>World Geo Game</title>
    <style id="expo-reset">
      :root {
        --app-bg: #0B1220;
      }
      html {
        height: 100%;
        height: -webkit-fill-available;
        background-color: var(--app-bg);
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        background-color: var(--app-bg);
        /* Kill rubber-band white flash on iOS Safari */
        position: fixed;
        inset: 0;
      }
      body {
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }
      #root {
        display: flex;
        flex-direction: column;
        flex: 1;
        width: 100%;
        height: 100%;
        height: 100dvh;
        height: -webkit-fill-available;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        overflow: hidden;
        background-color: var(--app-bg);
        box-sizing: border-box;
      }
      /* Larger tap targets / no double-tap zoom on chrome */
      button,
      a,
      [role="button"],
      input,
      select,
      textarea {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      /* Map: pan + pinch only inside the map; page does not zoom */
      .leaflet-container {
        background: #152238 !important;
        /* pan + pinch on map only; page uses manipulation / max-scale=1 */
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }
      .leaflet-control-zoom a {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .geo-pin {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      @media (max-width: 480px) {
        .leaflet-control-attribution {
          font-size: 9px !important;
          max-width: 55vw;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }
    </style>
  <meta name="theme-color" content="#0B1220">
<meta name="description" content="Learn world capitals, cities, and facts.">
</head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  
    <script>
      (function () {
        function inMap(el) {
          return !!(el && el.closest && el.closest('.leaflet-container'));
        }
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
          document.addEventListener(
            evt,
            function (e) {
              if (!inMap(e.target)) e.preventDefault();
            },
            { passive: false }
          );
        });
        document.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches && e.touches.length > 1 && !inMap(e.target)) {
              e.preventDefault();
            }
          },
          { passive: false }
        );
      })();
    </script>
<script src="/learning-hub/_expo/static/js/web/index-e692932e42ea2ff98944c1bb62b893a7.js" defer></script>
</body>
</html>
