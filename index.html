<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0B1220" />
    <title>World Geo Game</title>
    <style id="expo-reset">
      :root { --app-bg: #0B1220; }
      html { height: 100%; background-color: var(--app-bg); color-scheme: dark; }
      html, body { margin: 0; padding: 0; width: 100%; overflow: hidden; background-color: var(--app-bg); position: fixed; inset: 0; }
      #root { display: flex; flex: 1; width: 100%; height: 100%; background-color: var(--app-bg); }
      #dev-hotspot {
        position: fixed; right: 0; bottom: 0; width: 44px; height: 44px; z-index: 9998;
        background: transparent; border: 0; padding: 0;
      }
      #dev-panel {
        display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        z-index: 9999; width: min(92vw, 360px); background: #152238; color: #fff;
        border: 1px solid #3D5A80; border-radius: 16px; padding: 16px; font-family: system-ui, sans-serif;
      }
      #dev-panel h2 { margin: 0 0 8px; font-size: 18px; }
      #dev-panel p { margin: 0 0 14px; color: #9bb0c9; font-size: 13px; line-height: 1.4; }
      #dev-panel button { width: 100%; margin: 0 0 8px; padding: 12px; border-radius: 10px; border: 0; font-weight: 700; }
      #dev-reset { background: #c44; color: #fff; }
      #dev-close { background: #22334d; color: #d6e4f5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <button id="dev-hotspot" type="button" aria-label="Dev"></button>
    <div id="dev-panel">
      <h2>Dev settings</h2>
      <p>Hidden on purpose. Reset person unlocks Who are you? on this device only. Scores stay.</p>
      <button id="dev-reset" type="button">Reset person</button>
      <button id="dev-close" type="button">Close</button>
    </div>
    <script>
      (function () {
        var taps = 0, timer = null, panel = document.getElementById('dev-panel');
        document.getElementById('dev-hotspot').addEventListener('click', function () {
          taps += 1;
          clearTimeout(timer);
          timer = setTimeout(function () { taps = 0; }, 1600);
          if (taps >= 7) {
            taps = 0;
            panel.style.display = 'block';
          }
        });
        document.getElementById('dev-close').addEventListener('click', function () {
          panel.style.display = 'none';
        });
        document.getElementById('dev-reset').addEventListener('click', function () {
          if (!confirm('Reset person on this device? Who are you? will show again. Scores stay.')) return;
          var keys = ['@wgg/selectedFamily'];
          try {
            keys.forEach(function (k) {
              localStorage.removeItem(k);
              sessionStorage.removeItem(k);
            });
            Object.keys(localStorage).forEach(function (k) {
              if (k.indexOf('selectedFamily') !== -1) localStorage.removeItem(k);
            });
          } catch (e) {}
          location.reload();
        });
      })();
    </script>
    <script src="/learning-hub/_expo/static/js/web/index-e692932e42ea2ff98944c1bb62b893a7.js" defer></script>
  </body>
</html>
